services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      JWT_SECRET: finflow-local-compose-secret
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
