# This is a dev-mode compose file (bind-mounts source for hot reload).
# For normal local runs, prefer the project root's docker-compose.yml instead —
# `docker-compose up --build` from the repo root.
services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      - DATA_DIR=/app/data
    ports:
      - "3000:3000"
    volumes:
      - ../../backend:/app
      - /app/node_modules
      # SQLite data lives in its own named volume (not just the source bind
      # mount above) so it survives `docker-compose down` / image rebuilds
      # even if the bind mount is ever changed or dropped.
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
